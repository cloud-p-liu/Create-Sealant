plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    maven {
        name = 'RyanHCode'
        url = 'https://maven.ryanhcode.dev/releases'
    }

    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    compileOnly "io.github.llamalad7:mixinextras-neoforge:0.5.3"

    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:1.6.0"
    compileOnly "maven.modrinth:oWaK0Q19:${aeronautics_version}"
    compileOnly "maven.modrinth:LNytGWDc:${create_version}"
    compileOnly "maven.modrinth:T9PomCSv:${sable_version}"

    localRuntime "maven.modrinth:oWaK0Q19:${aeronautics_version}"
    localRuntime "maven.modrinth:LNytGWDc:${create_version}"
    localRuntime "maven.modrinth:T9PomCSv:${sable_version}"


}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            aeronautics_mod_version: aeronautics_mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Simulated is nested inside Aeronautics; expose it only to the compiler.
configurations { simulatedBundle { transitive = false } }
dependencies {
    simulatedBundle "maven.modrinth:oWaK0Q19:${aeronautics_version}"
    compileOnly files(layout.buildDirectory.file('upstream/simulated.jar'))
}
var extractSimulated = tasks.register('extractSimulated', Copy) {
    from({ zipTree(configurations.simulatedBundle.singleFile) }) {
        include 'META-INF/jarjar/dev.simulated_team.simulated.simulated-*.jar'
        eachFile { path = 'simulated.jar' }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('upstream')
}
tasks.named('compileJava') { dependsOn extractSimulated }
tasks.named('jar') {
    from('LICENSE', 'THIRD_PARTY_NOTICES.md')
    from('licenses') { into 'licenses' }
}

// Guard the exact data omission that broke the first rotated-structure game test.
var verifyChamberResources = tasks.register('verifyChamberResources') {
    inputs.files('src/main/resources/data/sable/tags/entity_type/retain_in_sub_level.json',
            'src/main/resources/data/sable/tags/entity_type/destroy_with_sub_level.json')
    doLast {
        inputs.files.each { tagFile ->
            def tag = new groovy.json.JsonSlurper().parse(tagFile)
            if (tag.replace != false || !tag.values.contains('sealant:chamber_structure')) {
                throw new GradleException("Required Sable chamber retention/lifecycle tag was removed: ${tagFile}")
            }
        }
    }
}
sourceSets {
    regression {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath + sourceSets.main.compileClasspath
    }
}
var verifyChamberGeometry = tasks.register('verifyChamberGeometry', JavaExec) {
    dependsOn tasks.named('regressionClasses')
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'com.sealant.chamber.ChamberRegressionChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}
tasks.named('check') { dependsOn verifyChamberResources, verifyChamberGeometry }


// Compile against the exact native adapter bundled with Sable; never ship a second adapter.
configurations { sableBundle { transitive = false } }
dependencies {
    sableBundle "maven.modrinth:T9PomCSv:${sable_version}"
    compileOnly files(layout.buildDirectory.file('upstream/sable-rapier.jar'))
}
var extractSableRapier = tasks.register('extractSableRapier', Copy) {
    from({ zipTree(configurations.sableBundle.singleFile) }) {
        include 'META-INF/jarjar/dev.ryanhcode.sable.sable-sable_rapier-*.jar'
        eachFile { path = 'sable-rapier.jar' }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('upstream')
}
tasks.named('compileJava') { dependsOn extractSableRapier }

// Reproducible geometry microbenchmark; real world/native costs use /sealant perf.
tasks.register('benchmarkChamber', JavaExec) {
    dependsOn tasks.named('regressionClasses')
    classpath = sourceSets.regression.runtimeClasspath
    mainClass = 'com.sealant.chamber.ChamberBenchmark'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
}

// Use Sable's exact bundled shader APIs, compiler-only; never ship a second Veil/GLSL copy.
dependencies {
    compileOnly files(layout.buildDirectory.file('upstream/veil.jar'), layout.buildDirectory.file('upstream/glsl.jar'))
}
var extractVeil = tasks.register('extractVeil', Copy) {
    from({ zipTree(configurations.sableBundle.singleFile) }) {
        include 'META-INF/jarjar/veil-*.jar'
        eachFile { path = 'veil.jar' }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('upstream')
}
var extractGlsl = tasks.register('extractGlsl', Copy) {
    dependsOn extractVeil, extractSimulated, extractSableRapier
    from({ zipTree(layout.buildDirectory.file('upstream/veil.jar').get().asFile) }) {
        include 'META-INF/jarjar/glsl-processor-*.jar'
        eachFile { path = 'glsl.jar' }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('upstream')
}
tasks.named('compileJava') { dependsOn extractGlsl }

// Compile against the Ponder API actually bundled by the pinned Create build.
// This avoids a separate stale API download and never repackages Ponder.
configurations { createBundle { transitive = false } }
dependencies {
    createBundle "maven.modrinth:LNytGWDc:${create_version}"
    compileOnly files(layout.buildDirectory.file('upstream/ponder/ponder.jar'))
}
var extractPonder = tasks.register('extractPonder', Copy) {
    from({ zipTree(configurations.createBundle.singleFile) }) {
        include 'META-INF/jarjar/ponder-neoforge-*.jar'
        eachFile { path = 'ponder.jar' }
        includeEmptyDirs = false
    }
    into layout.buildDirectory.dir('upstream/ponder')
}
tasks.named('compileJava') { dependsOn extractPonder }
